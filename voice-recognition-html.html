<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎙 Voice Recognition App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #startBtn.recording {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        #stopBtn {
            background: #e74c3c;
            color: white;
        }

        #stopBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #clearBtn {
            background: #95a5a6;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 500;
        }

        .status-idle {
            background: #ecf0f1;
            color: #7f8c8d;
        }

        .status-listening {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #27ae60;
            border-radius: 50%;
            animation: pulse-dot 1s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .output-area {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 15px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            font-size: 16px;
            line-height: 1.6;
            color: #333;
        }

        .output-area.empty {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #adb5bd;
            font-style: italic;
        }

        .transcript-item {
            margin-bottom: 15px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .transcript-time {
            font-size: 12px;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .language-selector {
            text-align: center;
            margin-bottom: 20px;
        }

        .language-selector select {
            padding: 10px 20px;
            font-size: 14px;
            border: 2px solid #dee2e6;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            font-size: 14px;
            color: #0c5460;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙 Voice Recognition App</h1>
            <p>Click start and speak into your microphone</p>
        </div>

        <div class="language-selector">
            <label for="languageSelect">Language: </label>
            <select id="languageSelect">
                <option value="en-US">English (US)</option>
                <option value="en-GB">English (UK)</option>
                <option value="es-ES">Spanish</option>
                <option value="fr-FR">French</option>
                <option value="de-DE">German</option>
                <option value="it-IT">Italian</option>
                <option value="pt-BR">Portuguese (Brazil)</option>
                <option value="zh-CN">Chinese (Mandarin)</option>
                <option value="ja-JP">Japanese</option>
                <option value="ko-KR">Korean</option>
                <option value="hi-IN">Hindi</option>
                <option value="ta-IN">Tamil</option>
            </select>
        </div>

        <div class="status">
            <span id="statusIndicator" class="status-indicator status-idle">
                Ready to record
            </span>
        </div>

        <div class="controls">
            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div id="outputArea" class="output-area empty">
            Your recognized speech will appear here...
        </div>

        <div class="info-box" id="infoBox">
            <strong>ℹ️ Browser Support</strong>
            This app uses the Web Speech API. Works best in Chrome, Edge, and Safari.
        </div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const outputArea = document.getElementById('outputArea');
        const statusIndicator = document.getElementById('statusIndicator');
        const languageSelect = document.getElementById('languageSelect');
        const infoBox = document.getElementById('infoBox');

        let recognition;
        let isRecording = false;
        let transcripts = [];

        // Check browser support
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = languageSelect.value;

            infoBox.innerHTML = '<strong>✅ Ready!</strong> Your browser supports voice recognition.';
            infoBox.style.background = '#d4edda';
            infoBox.style.borderColor = '#28a745';
        } else {
            infoBox.innerHTML = '<strong>❌ Not Supported</strong> Your browser doesn\'t support the Web Speech API. Please use Chrome, Edge, or Safari.';
            infoBox.style.background = '#f8d7da';
            infoBox.style.borderColor = '#dc3545';
            startBtn.disabled = true;
            return;
        }

        languageSelect.addEventListener('change', () => {
            recognition.lang = languageSelect.value;
        });

        // ✅ Fixed: Request mic permission on user click
        startBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    await navigator.mediaDevices.getUserMedia({ audio: true });
                    console.log('Microphone access granted');

                    recognition.start();
                    isRecording = true;
                    startBtn.textContent = '🎤 Listening...';
                    startBtn.classList.add('recording');
                    stopBtn.disabled = false;
                    updateStatus('listening', 'Listening... Speak now!');
                } catch (err) {
                    console.error('Microphone access denied:', err);
                    updateStatus('error', 'Please allow microphone access.');
                    return;
                }
            }
        });

        stopBtn.addEventListener('click', () => {
            if (isRecording) {
                recognition.stop();
                isRecording = false;
                startBtn.textContent = 'Start Recording';
                startBtn.classList.remove('recording');
                stopBtn.disabled = true;
                updateStatus('idle', 'Recording stopped');
            }
        });

        clearBtn.addEventListener('click', () => {
            transcripts = [];
            outputArea.innerHTML = 'Your recognized speech will appear here...';
            outputArea.classList.add('empty');
        });

        recognition.onresult = (event) => {
            let interimTranscript = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript + ' ';
                } else {
                    interimTranscript += transcript;
                }
            }

            if (finalTranscript) addTranscript(finalTranscript.trim());
            if (interimTranscript) updateStatus('listening', `Hearing: "${interimTranscript}"`);
        };

        recognition.onend = () => {
            if (isRecording) recognition.start();
            else updateStatus('idle', 'Ready to record');
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            let errorMessage;
            switch(event.error) {
                case 'no-speech': errorMessage = 'No speech detected. Please try again.'; break;
                case 'audio-capture': errorMessage = 'Microphone not found or not accessible.'; break;
                case 'not-allowed': errorMessage = 'Microphone access denied. Please allow access.'; break;
                case 'network': errorMessage = 'Network error. Check your connection.'; break;
                default: errorMessage = `Error: ${event.error}`;
            }
            updateStatus('error', errorMessage);
            if (isRecording) {
                isRecording = false;
                startBtn.textContent = 'Start Recording';
                startBtn.classList.remove('recording');
                stopBtn.disabled = true;
            }
        };

        function updateStatus(type, message) {
            statusIndicator.className = 'status-indicator';
            if (type === 'listening') {
                statusIndicator.classList.add('status-listening');
                statusIndicator.innerHTML = `<span class="pulse-dot"></span> ${message}`;
            } else if (type === 'error') {
                statusIndicator.classList.add('status-error');
                statusIndicator.textContent = '⚠️ ' + message;
            } else {
                statusIndicator.classList.add('status-idle');
                statusIndicator.textContent = message;
            }
        }

        function addTranscript(text) {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            transcripts.push({ text, time: timeString });
            displayTranscripts();
        }

        function displayTranscripts() {
            if (transcripts.length === 0) {
                outputArea.innerHTML = 'Your recognized speech will appear here...';
                outputArea.classList.add('empty');
                return;
            }
            outputArea.classList.remove('empty');
            outputArea.innerHTML = transcripts.map(item => `
                <div class="transcript-item">
                    <div class="transcript-time">${item.time}</div>
                    <div>${item.text}</div>
                </div>
            `).join('');
            outputArea.scrollTop = outputArea.scrollHeight;
        }
    </script>
</body>
</html>
